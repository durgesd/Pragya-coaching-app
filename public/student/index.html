<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pragya Coaching</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f4858">
<link rel="stylesheet" href="/shared/styles.css">
</head>
<body oncontextmenu="return false;">

<div class="view active" id="view-login">
  <header class="app-header"><h1>🍎 Pragya Coaching</h1><p>Student Login</p></header>
  <main>
    <div class="card">
      <label>Class</label>
      <select id="loginClass"></select>
      <label>Roll Number</label>
      <input type="text" id="loginRoll" inputmode="numeric">
      <label>PIN</label>
      <input type="password" id="loginPin" inputmode="numeric" maxlength="6">
      <div class="btn-row"><button class="btn primary block" onclick="studentLogin()">Log In</button></div>
      <div class="error-msg" id="loginError"></div>
    </div>
  </main>
</div>

<div class="view" id="view-app">
  <header class="app-header"><h1>🍎 Pragya Coaching</h1><p id="welcomeLine">My Homework</p></header>
  <main>
    <div class="card" id="notifyCard">
      <h3>🔔 Get notified instantly</h3>
      <p class="hint">Turn on notifications so you know the moment your teacher sends new homework.</p>
      <button class="btn brass block" id="notifyBtn" onclick="enableNotifications()">🔔 Enable Notifications</button>
    </div>
    <div id="homeworkList"></div>
  </main>
  <div class="tabbar">
    <button class="tab-btn active"><span class="icon">📚</span>Homework</button>
    <button class="tab-btn" onclick="logout()"><span class="icon">🚪</span>Logout</button>
  </div>
</div>

<!-- Content Viewer Modal -->
<div class="modal-overlay" id="viewerModal">
  <div class="modal-sheet">
    <div class="modal-head">
      <h3 id="viewerTitle">Homework</h3>
      <button class="close-x" onclick="closeViewer()">✕</button>
    </div>
    <div class="modal-body protected" id="viewerBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
